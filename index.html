<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAYZO - OS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#0d0f14;--p:#141720;--b:#252a3a;--t:#e8eaf0;--m:#9ba3c0;--g:#3dd68c;--r:#ff4f4f;--a:#f5c842;--c:#4f7cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:210px;flex:none;background:#0d0f14;border-right:1px solid var(--b);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
aside h2{font:700 15px 'JetBrains Mono',monospace;letter-spacing:.08em;color:#fff;margin:0 0 14px 10px}
aside button.n{border:0;background:none;text-align:left;padding:10px 12px;border-radius:6px;color:var(--m)}
aside button.n.on{background:rgba(79,124,255,.12);color:#fff}
main{flex:1;min-width:0;padding:20px 24px 60px}
h1{margin:0 0 14px;font-size:21px;color:#fff}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px;margin-bottom:14px}
.lab{font:11px 'JetBrains Mono',monospace;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
button,select,input,textarea{font:inherit;color:var(--t);background:#0d0f14;border:1px solid #252a3a;border-radius:6px;padding:6px 9px}
button{cursor:pointer;background:#1c2030}
button.p{background:var(--c);border-color:var(--c);color:#fff}
button.i{border-color:#6b5a1e;color:var(--a)}
textarea{width:100%;min-height:90px;resize:both;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.st{display:flex;flex-wrap:wrap;gap:6px}
.st button.on{background:var(--c);color:#fff;border-color:var(--c)}
.ent{display:flex;gap:12px;margin-bottom:10px}
.tm{width:92px;flex:none;color:var(--g);font:14px 'JetBrains Mono',monospace}
.pr{display:flex;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.pr.rev{flex-direction:row-reverse}
.pr>div{flex:1 1 260px;min-width:0}
.th img{width:100%;border-radius:6px;border:1px solid var(--b);margin-bottom:6px;display:block;cursor:pointer}
.g2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
table{width:100%;border-collapse:collapse}
td,th{padding:4px;border-bottom:1px solid var(--b);text-align:left}
th{font:11px 'JetBrains Mono',monospace;color:var(--m);font-weight:400}
td input,td select{width:100%}
.w{color:var(--g)}.a{color:var(--a)}
.ov{overflow-x:auto}
.fl{cursor:pointer;padding:6px 9px;border:1px solid #252a3a;border-radius:6px;display:inline-block}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cd{padding:8px 0;position:relative}
.cd.on{background:var(--c);color:#fff;border-color:var(--c)}
.cd.td{border-color:var(--a)}
.cd i{position:absolute;top:2px;right:4px;font:10px 'JetBrains Mono',monospace;color:var(--a);font-style:normal}
.cd.on i{color:#fff}
@media(max-width:800px){body{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap}}
</style></head>
<body><aside id="sb"></aside><main id="m"></main>
<script>
const SB_URL='https://zyktlsqtqahgpvsmyshl.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5a3Rsc3F0cWFoZ3B2c215c2hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTQ0MjcsImV4cCI6MjEwNzQ5MDQyN30.LtEysHNdbHneCh4odu_loQqOkgdIfhn4KSEIv9VHqlo',sb=SB_URL.startsWith('PASTE')?null:window.supabase.createClient(SB_URL,SB_KEY);let UID=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PH=['Pre-session','Setup forming','Trade','Management'];
const ST=[['Pre-session','Check news, mark the Asia range'],['Open profile','2AM candle vs VWAP: Open / Above / Below'],['Expectation','Recall what this profile usually does'],['Wait','First D2 band mitigation'],['Trigger','1M BOS after mitigation. 15M EMA Strong or Weak?'],['Management','50% off at VWAP, runner on the rest'],['Exit / flip','Continuation BOS after D2 mitigation: exit and flip to D2 Continuation'],['Result','Log R, plan followed, deviation']];
const SP=[['News calendar',['No news','Medium','High']],['Asia range marked'],['VWAP state at 2AM',['Open','Above','Below']],['Expected profile',['A','B','C','Unsure']],['Risk reminder']];
const TABS=[['daily','Daily Session'],['pb','Playbook'],['bt','Backtesting'],['dev','Development Journal'],['acc','Accounts & P&L'],['fin','Finance'],['ver','System Version Log'],['wk','Weekend Review']];
const CATS=['Evaluation fee','Payout','Subscription','Other'];
const BT={timeZone:'Europe/Berlin'},TODAY=new Date().toLocaleDateString('en-CA',BT);
let S={tab:'daily',date:TODAY,dev:[],bt:[],acc:[],tx:[],pnl:[],inc:[],ver:null,days:{}};
const uid=()=>Math.random().toString(36).slice(2,9),now=()=>new Date().toLocaleTimeString('en-GB',{...BT,hour:'2-digit',minute:'2-digit'});
const D=()=>S.days[S.date]??={chk:{},stage:0,ents:[],ideas:[]};
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const idb=()=>new Promise(r=>{const q=indexedDB.open('kayos',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const old=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result)})};
const up=async d=>{const b=await(await fetch(d)).blob(),p=`${UID}/${uid()}.webp`,r=await sb.storage.from('shots').upload(p,b,{contentType:'image/webp'});if(r.error)throw r.error;return(await sb.storage.from('shots').createSignedUrl(p,31536000)).data.signedUrl};
const offload=async()=>{for(const v of Object.values(S.days))for(const L of[v.ents,v.ideas])for(const e of L||[])for(let i=0;i<(e.img||[]).length;i++)if(e.img[i].startsWith('data:'))e.img[i]=await up(e.img[i])};
const load=async()=>(await sb.from('kayzo_state').select('data').eq('user_id',UID).maybeSingle()).data?.data;
let tm;const save=()=>{clearTimeout(tm);const e=$('sv');if(e)e.textContent='Saving...';tm=setTimeout(async()=>{try{await offload();const r=await sb.from('kayzo_state').upsert({user_id:UID,data:S,updated_at:new Date().toISOString()});if(r.error)throw r.error;if($('sv'))$('sv').textContent='Saved to Supabase'}catch(x){if($('sv'))$('sv').textContent='Save failed: '+x.message}},600)};
const set=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v;save()};
const sel=(p,o)=>`<select data-k="${p}" data-r>${o.map(x=>`<option${x==get(p)?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
const inp=(p,t='text',ph='',r)=>`<input data-k="${p}" type="${t}" placeholder="${ph}" value="${esc(get(p))}"${r?' data-r':''}>`;
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const avg=a=>a.length?(a.reduce((x,y)=>x+y)/a.length).toFixed(2):'-';
const nums=a=>a.map(r=>parseFloat(r.r)).filter(x=>!isNaN(x));
const W=s=>new Set((s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3));
const TG=s=>(s||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);
const allIdeas=()=>Object.entries(S.days).flatMap(([d,v])=>v.ideas.map(i=>({...i,d})));
const seen=i=>{const a=W(i.text),ta=TG(i.tags);return allIdeas().filter(o=>o.id!=i.id&&(o.d<i.d||(o.d==i.d&&o.time<i.time))).filter(o=>{const b=W(o.text);let n=0;a.forEach(w=>b.has(w)&&n++);const u=a.size+b.size-n;return(u&&n/u>=.25)||TG(o.tags).filter(x=>ta.includes(x)).length>=2})};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/webp',.8))};i.src=URL.createObjectURL(f)});
const addImgs=async(p,fs)=>{const a=get(p);for(const f of fs)if(f.type.startsWith('image/'))a.push(await shrink(f));save();render()};
const csv=x=>{x.split(/\r?\n/).slice(1).forEach(l=>{const c=l.split(',');if(c.length<3)return;const d=c.slice(1,-1).join(','),amt=c[c.length-1];if(S.tx.some(t=>t.date==c[0]&&t.desc==d&&t.amt==amt))return;const cat=/payout|withdraw/i.test(d)?'Payout':/eval|challenge|funded|prop|fee/i.test(d)?'Evaluation fee':/tradingview|subscri/i.test(d)?'Subscription':'Other';S.tx.push({id:uid(),date:c[0],acc:'',cat,desc:d,amt})});save();render()};
const A={
tab:d=>{S.tab=d.v;render()},
login:async()=>{const r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});r.error?showLogin(r.error.message):start(r.data.user.id)},
out:async()=>{await sb.auth.signOut();location.reload()},
day:d=>{S.date=d.v;S.cal=d.v.slice(0,7);render()},
mo:d=>{const[y,m]=(S.cal||S.date.slice(0,7)).split('-').map(Number),t=new Date(y,m-1+ +d.v,1);S.cal=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');render()},
stage:d=>{D().stage=+d.v;save();render()},
addEnt:()=>{D().ents.push({id:uid(),time:now(),ph:'Setup forming',tags:'',note:'',img:[],rev:false});save();render()},
rev:d=>{const e=D().ents.find(x=>x.id==d.v);e.rev=!e.rev;save();render()},
del:d=>{const a=get(d.p);a.splice(a.findIndex(x=>x.id==d.v),1);save();render()},
rmimg:d=>{get(d.p).splice(+d.v,1);save();render()},
idea:d=>{const a=D().ents,e=a.splice(a.findIndex(x=>x.id==d.v),1)[0];D().ideas.push({id:e.id,time:e.time,text:e.note,tags:e.tags,img:e.img});save();render()},
back:d=>{const a=D().ideas,e=a.splice(a.findIndex(x=>x.id==d.v),1)[0];D().ents.push({id:e.id,time:e.time,ph:'Setup forming',tags:e.tags,note:e.text,img:e.img,rev:false});save();render()},
add:d=>{const m={dev:{id:uid(),date:S.date,tag:'New Observation',title:'',status:'Open',body:''},pnl:{id:uid(),date:S.date,pts:'',usd:''},inc:{id:uid(),date:S.date,amt:''},ver:{id:uid(),v:'',date:S.date,what:'',why:'',ev:''},bt:{id:uid(),date:S.date,vwap:'',profile:'',res:'',r:'',tags:'',notes:''},acc:{id:uid(),name:'',firm:'',size:'',phase:'',status:''},tx:{id:uid(),date:S.date,acc:'',cat:'Other',desc:'',amt:''}}[d.v];S[d.v][d.v=='ver'?'push':'unshift'](m);save();render()},
mic:d=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice input needs Chrome, Edge or Safari');const r=new R();r.onresult=e=>{const el=document.querySelector(`[data-k="${d.p}"]`);el.value=(el.value+' '+e.results[0][0].transcript).trim();set(d.p,el.value)};r.start()},
exp:()=>dl('kayzo-os-backup.json',JSON.stringify(S),'application/json'),
cx:()=>{const ds=Object.entries(S.days).filter(([,v])=>v.rec&&(v.rec.pr||v.rec.ex)).sort((a,b)=>a[0]<b[0]?-1:1).slice(-10).map(([date,v])=>({date,...v.rec,total:(parseFloat(v.rec.p1)||0)+(parseFloat(v.rec.p2)||0)}));dl('kayzo-os-claude-context.json',JSON.stringify({systemVersion:S.ver.at(-1)?.v,versionLog:S.ver,last10Sessions:ds,accounts:S.acc,openObservations:S.dev.filter(x=>x.status=='Open')},null,1),'application/json')},
mdx:()=>{const d=D();dl(`daily-log-${S.date}.md`,`# Daily log ${S.date}\n\n## Session open\n${SP.map(([n],i)=>`- ${d.chk['s'+i]?'[x]':'[ ]'} ${n}${d.chk['v'+i]?': '+d.chk['v'+i]:''}`).join('\n')}\n\nStage: ${ST[d.stage][0]}\n\n## Timeline\n${[...d.ents].sort((a,b)=>a.time<b.time?-1:1).map(e=>`### ${e.time} · ${e.ph}${e.tags?' · '+e.tags:''}\n${e.note}\n(${e.img.length} screenshots)`).join('\n\n')}\n\n## Thoughts and ideas\n${d.ideas.map(i=>{const m=seen({...i,d:S.date});return `- ${i.time} ${i.text} (${m.length?'seen '+m.length+' times before':'new'})`}).join('\n')}\n`,'text/markdown')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k)set(t.dataset.k,t.type=='checkbox'?t.checked:t.value)});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='dt'){S.date=t.value||S.date;return render()}if(t.dataset.r)render();if(t.type=='file'&&t.files.length){const f=t.dataset.f;if(f=='img')addImgs(t.dataset.p,t.files);else{const x=await t.files[0].text();if(f=='imp'){S={...S,...JSON.parse(x)};save();render()}else csv(x)}}});
document.addEventListener('paste',e=>{const b=e.target.closest?.('[data-ip]'),fs=[...(e.clipboardData?.files||[])];if(b&&fs.length){e.preventDefault();addImgs(b.dataset.ip,fs)}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pw')A.login()});
document.addEventListener('drop',e=>{const b=e.target.closest?.('[data-ip]');if(b){e.preventDefault();addImgs(b.dataset.ip,e.dataTransfer.files)}});
const en=(e,p)=>`<div class="ent"><div class="tm">${inp(p+'.time','time')}</div><div class="card pr${e.rev?' rev':''}" style="flex:1" data-ip="${p}.img"><div class="th">${e.img.map((s,j)=>`<img src="${s}" title="Click to remove" data-a="rmimg" data-p="${p}.img" data-v="${j}">`).join('')}<label class="lab"><input type="file" accept="image/*" multiple hidden data-f="img" data-p="${p}.img"><span class="fl">+ Screenshots</span> or paste / drop here</label></div><div><textarea data-k="${p}.note" placeholder="What do you see now?">${esc(e.note)}</textarea>${inp(p+'.tags','text','tags, comma separated')}<div class="g2">${sel(p+'.ph',PH)}<button data-a="mic" data-p="${p}.note">Mic</button><button data-a="rev" data-v="${e.id}">Swap sides</button><button class="i" data-a="idea" data-v="${e.id}">Mark as thought / idea</button><button data-a="del" data-p="days.${S.date}.ents" data-v="${e.id}">Delete</button></div></div></div></div>`;
const cal=()=>{const m=S.cal||S.date.slice(0,7),[y,mo]=m.split('-').map(Number),f=new Date(y,mo-1,1),off=(f.getDay()+6)%7,n=new Date(y,mo,0).getDate();let c='';for(let i=0;i<off;i++)c+='<span></span>';for(let d=1;d<=n;d++){const k=`${m}-${String(d).padStart(2,'0')}`,v=S.days[k],cnt=v?v.ents.length+v.ideas.length:0;c+=`<button class="cd${k==S.date?' on':''}${k==TODAY?' td':''}" data-a="day" data-v="${k}">${d}${cnt?`<i>${cnt}</i>`:''}</button>`}
return `<div class="card" style="max-width:380px"><div class="bar" style="justify-content:space-between"><button data-a="mo" data-v="-1">&lt;</button><b>${f.toLocaleString('en',{month:'long',year:'numeric'})}</b><button data-a="mo" data-v="1">&gt;</button></div><div class="cg">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span class="lab">${x}</span>`).join('')}${c}</div></div>`};
const daily=()=>{const d=D(),P=`days.${S.date}.`,vw=d.chk.v2,m=S.bt.filter(r=>vw&&r.vwap==vw),w=m.filter(r=>r.res=='Win').length;
return `<h1>Daily Session</h1>${cal()}<div class="bar"><b>${S.date}</b><button data-a="day" data-v="${TODAY}">Today</button><button class="p" data-a="addEnt">+ Add entry</button><button data-a="mdx">Export day (.md)</button><button data-a="cx">Export for Claude (.json)</button></div>
${rec(d,P)}<div class="card"><div class="lab">Session open</div><table>${SP.map(([n,o],i)=>`<tr><td style="width:30px"><input type="checkbox" data-k="${P}chk.s${i}"${d.chk['s'+i]?' checked':''}><td>${n}<td>${o?sel(P+'chk.v'+i,['',...o]):i==4?inp(P+'chk.v4','text','your rule here'):''}`).join('')}</table>${vw?`<p class="a">Likely today: ${m.length?`${m.length} logged sessions with VWAP ${vw}, ${Math.round(w/m.length*100)}% wins, avg R ${avg(nums(m))}`:'no logged sessions with this VWAP state yet (add them in Backtesting)'}</p>`:''}</div>
<div class="card"><div class="lab">Where are you now</div><div class="st">${ST.map((s,i)=>`<button class="${d.stage==i?'on':''}" data-a="stage" data-v="${i}">${i+1}. ${s[0]}</button>`).join('')}</div><p>${ST[d.stage][1]}</p></div>
${PH.map(ph=>{const L=d.ents.map((e,i)=>[e,i]).filter(([e])=>e.ph==ph).sort((a,b)=>a[0].time<b[0].time?-1:1);return L.length?`<div class="lab" style="margin:16px 0 8px">${ph} · ${L.length}</div>`+L.map(([e,i])=>en(e,P+'ents.'+i)).join(''):''}).join('')}
<div class="card"><div class="lab">Thoughts and ideas · ${d.ideas.length}</div>${d.ideas.map(i=>{const x=seen({...i,d:S.date});return `<div style="padding:10px 0;border-bottom:1px solid var(--b)"><span class="tm">${i.time}</span> ${esc(i.text)} <span class="lab">${esc(i.tags)}</span><div class="th">${i.img.map(s=>`<img src="${s}" style="max-width:260px">`).join('')}</div><span class="${x.length?'a':'w'}">${x.length?`Seen ${x.length} time${x.length>1?'s':''} before, last ${x.map(y=>y.d).sort().pop()}`:'New, no earlier match'}</span> <button data-a="back" data-v="${i.id}">Move back to timeline</button></div>`}).join('')||'<p class="lab">Nothing marked yet</p>'}</div>`};
const bt=()=>{const n=S.bt.length,w=S.bt.filter(r=>r.res=='Win').length;return `<h1>Backtesting</h1><div class="card"><span style="font:600 28px 'JetBrains Mono',monospace;color:var(--c)">${n} / 450</span> <span class="lab">days of structure and profile data</span><div style="height:6px;background:var(--b);border-radius:3px;margin-top:8px"><div style="height:100%;width:${Math.min(100,n/4.5)}%;background:var(--c);border-radius:3px"></div></div></div><div class="bar"><button class="p" data-a="add" data-v="bt">+ Add session</button><span>${n} sessions · ${n?Math.round(w/n*100):0}% wins · avg R ${avg(nums(S.bt))}</span></div><div class="card ov"><table><tr><th>Date<th>1H structure<th>1H profile<th>VWAP<th>Profile<th>Result<th>R<th>Tags<th>Notes<th></tr>${S.bt.map((r,i)=>{const p='bt.'+i;return `<tr><td>${inp(p+'.date','date')}<td>${sel(p+'.st',RF[0][2])}<td>${sel(p+'.dp',RF[1][2])}<td>${sel(p+'.vwap',['','Open','Above','Below'])}<td>${sel(p+'.profile',['','A','B','C'])}<td>${sel(p+'.res',['','Win','Loss','BE'])}<td>${inp(p+'.r','number','','r')}<td>${inp(p+'.tags')}<td>${inp(p+'.notes')}<td><button data-a="del" data-p="bt" data-v="${r.id}">x</button>`}).join('')}</table></div>`};
const RF=[['1H structure','st',['','Bullish','Bearish']],['1H profile','pr',['','F-BOS Bullish','F-BOS Bearish','Asia Range Continued','Asia Range Untouched','Early Liquidation']],['Pre-market liquidity run','lq',['','Yes','No','N/A']],['Entry model','em',['','1M CHoCH','5M OF mitigation','Re-entry','No trade']],['Expectation matched','mt',['','Yes','Partial','No']],['FDAX / Forex.com primary chart','cs',['','Yes','No']]];
const rec=(d,P)=>{d.rec??={};const r=d.rec,q=P+'rec.',tot=(parseFloat(r.p1)||0)+(parseFloat(r.p2)||0);
return `<div class="card"><div class="lab">Session record · Berlin time</div><div class="g2">${RF.map(([n,k,o])=>`<label>${n}<br>${sel(q+k,o)}</label>`).join('')}<label>System version<br>${sel(q+'sv',['',...S.ver.map(v=>v.v)])}</label></div><div class="g2"><label>Position 1 points<br>${inp(q+'p1','number','','r')}</label><label>Runner points<br>${inp(q+'p2','number','','r')}</label><b class="w">Total ${tot}</b></div><label>Pre-session expectation<br><textarea data-k="${q}ex">${esc(r.ex)}</textarea></label><button data-a="mic" data-p="${q}ex">Mic</button><label> What happened at the open<br><textarea data-k="${q}op">${esc(r.op)}</textarea></label><button data-a="mic" data-p="${q}op">Mic</button></div>`};
const pb=()=>{const R=Object.entries(S.days).filter(([,v])=>v.rec?.pr).map(([date,v])=>({date,...v.rec,t:(parseFloat(v.rec.p1)||0)+(parseFloat(v.rec.p2)||0)}));
return `<h1>Playbook</h1><p class="lab">Auto-generated from Daily Session. Read before the session.</p>${RF[1][2].slice(1).map(p=>{const x=R.filter(r=>r.pr==p).sort((a,b)=>a.date<b.date?-1:1),m=x.filter(r=>r.mt=='Yes'),n=x.filter(r=>r.mt=='Partial'||r.mt=='No'),f={};x.forEach(r=>r.em&&(f[r.em]=(f[r.em]||0)+1));const top=Object.entries(f).sort((a,b)=>b[1]-a[1])[0];
return `<div class="card"><b>${p}</b><p>${x.length} sessions · match rate ${x.length?Math.round(m.length/x.length*100):0}% · avg points when matched ${avg(m.map(r=>r.t))} · when not ${avg(n.map(r=>r.t))}</p><p class="lab">Most common entry model: ${top?top[0]+' ('+top[1]+')':'none yet'}</p>${x.slice(-5).reverse().map(r=>`<p>${r.date} · ${r.mt||'-'} · ${r.t} pts · ${esc(r.op||'')}</p>`).join('')}</div>`}).join('')}`};
const acc=()=>{const k=a=>a.reduce((s,t)=>s+(parseFloat(t.usd)||0),0),t=new Date(TODAY),ws=new Date(t-((t.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10),mo=TODAY.slice(0,7),P=S.pnl.slice().sort((a,b)=>a.date<b.date?-1:1);let c=0;const pts=P.map(r=>[r,c+=parseFloat(r.usd)||0]),mx=Math.max(...pts.map(x=>Math.abs(x[1])),1),W=600,H=140,xy=(i,v)=>[P.length>1?i/(P.length-1)*W:W/2,H/2-v/mx*(H/2-8)];
const chart=pts.length?`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:700px"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#252a3a"/>${pts.map(([r,v],i)=>{const[x,y]=xy(i,v),[x0,y0]=i?xy(i-1,pts[i-1][1]):[x,y],col=(parseFloat(r.usd)||0)>=0?'#3dd68c':'#ff4f4f';return `<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="3" fill="${col}"/>`}).join('')}</svg>`:'<p class="lab">Add daily P&L to see the equity curve</p>';
return `<h1>Accounts & P&L</h1><div class="bar"><button class="p" data-a="add" data-v="acc">+ Account</button></div><div class="card ov"><table><tr><th>Name<th>Firm<th>Size<th>Balance<th>Equity<th>Daily DD left<th>ATM limit<th>Payouts<th>Status<th></tr>${S.acc.map((r,i)=>{const p='acc.'+i;return `<tr><td>${inp(p+'.name')}<td>${inp(p+'.firm')}<td>${inp(p+'.size')}<td>${inp(p+'.bal')}<td>${inp(p+'.eq')}<td>${inp(p+'.dd')}<td>${inp(p+'.atm')}<td>${inp(p+'.po')}<td>${sel(p+'.status',['','Active','Passed','Blown'])}<td><button data-a="del" data-p="acc" data-v="${r.id}">x</button>`}).join('')}</table></div>
<h1>P&L</h1><div class="bar"><button class="p" data-a="add" data-v="pnl">+ Day</button><span>Week ${k(S.pnl.filter(r=>r.date>=ws)).toFixed(2)} · Month ${k(S.pnl.filter(r=>(r.date||'').startsWith(mo))).toFixed(2)} · All-time ${k(S.pnl).toFixed(2)}</span></div><div class="card">${chart}</div><div class="card ov"><table><tr><th>Date<th>Points<th>Dollar P&L<th></tr>${S.pnl.map((r,i)=>{const p='pnl.'+i;return `<tr><td>${inp(p+'.date','date','','r')}<td>${inp(p+'.pts','number')}<td>${inp(p+'.usd','number','','r')}<td><button data-a="del" data-p="pnl" data-v="${r.id}">x</button>`}).join('')}</table></div>`};
const fin=()=>{const sum=a=>a.reduce((s,t)=>s+(parseFloat(t.amt)||0),0),po=sum(S.tx.filter(t=>t.cat=='Payout')),co=sum(S.tx.filter(t=>t.cat!='Payout')),inc=sum(S.inc),M={};
S.inc.forEach(r=>{const m=(r.date||'').slice(0,7);M[m]=M[m]||{i:0,p:0};M[m].i+=parseFloat(r.amt)||0});S.tx.filter(t=>t.cat=='Payout').forEach(r=>{const m=(r.date||'').slice(0,7);M[m]=M[m]||{i:0,p:0};M[m].p+=parseFloat(r.amt)||0});const mx=Math.max(...Object.values(M).map(x=>x.i+x.p),1);
return `<h1>Finance</h1><div class="card"><div class="lab">Income received · 50% goes to the trading deposit</div><div class="bar" style="margin-top:8px"><button class="p" data-a="add" data-v="inc">+ Income</button><span>Income ${inc.toFixed(2)} · Total deposited (50%) ${(inc/2).toFixed(2)} · Prop payouts ${po.toFixed(2)}</span></div><table><tr><th>Date<th>Amount<th>50% deposit<th></tr>${S.inc.map((r,i)=>{const p='inc.'+i;return `<tr><td>${inp(p+'.date','date')}<td>${inp(p+'.amt','number','','r')}<td>${((parseFloat(r.amt)||0)/2).toFixed(2)}<td><button data-a="del" data-p="inc" data-v="${r.id}">x</button>`}).join('')}</table></div>
<div class="card"><div class="lab">By month: income (blue) and prop payouts (green)</div>${Object.entries(M).sort().map(([m,x])=>`<p>${m||'no date'} <span style="display:inline-block;height:10px;width:${x.i/mx*300}px;background:var(--c)"></span><span style="display:inline-block;height:10px;width:${x.p/mx*300}px;background:var(--g)"></span> ${x.i.toFixed(0)} / ${x.p.toFixed(0)}</p>`).join('')||'<p class="lab">No data yet</p>'}</div>
<div class="bar"><button class="p" data-a="add" data-v="tx">+ Transaction</button><label><input type="file" accept=".csv" hidden data-f="csv"><span class="fl">Import bank CSV (date,description,amount)</span></label><span>Costs ${co.toFixed(2)}</span></div><p class="lab">Expenses negative, payouts positive</p>
<div class="card ov"><table><tr><th>Date<th>Account<th>Category<th>Description<th>Amount<th></tr>${S.tx.map((r,i)=>{const p='tx.'+i;return `<tr><td>${inp(p+'.date','date')}<td>${sel(p+'.acc',['',...S.acc.map(a=>a.name)])}<td>${sel(p+'.cat',CATS)}<td>${inp(p+'.desc')}<td>${inp(p+'.amt','number','','r')}<td><button data-a="del" data-p="tx" data-v="${r.id}">x</button>`}).join('')}</table></div>`};
const ver=()=>`<h1>System Version Log</h1><div class="bar"><button class="p" data-a="add" data-v="ver">+ Version</button></div>${S.ver.map((r,i)=>[r,i]).reverse().map(([r,i])=>{const p='ver.'+i;return `<div class="card">${inp(p+'.v','text','v1.5')} ${inp(p+'.date','date')} <button data-a="del" data-p="ver" data-v="${r.id}">Delete</button><label>What changed<textarea style="min-height:56px" data-k="${p}.what">${esc(r.what)}</textarea></label><label>Why<textarea style="min-height:56px" data-k="${p}.why">${esc(r.why)}</textarea></label><label>Evidence that triggered it<textarea style="min-height:56px" data-k="${p}.ev">${esc(r.ev)}</textarea></label></div>`}).join('')}`;
const dev=()=>`<h1>Development Journal</h1><p class="lab">Observations only. Nothing here is a rule until promoted to the Playbook.</p><div class="bar"><button class="p" data-a="add" data-v="dev">+ Note</button></div>${S.dev.map((r,i)=>{const p='dev.'+i;return `<div class="card">${inp(p+'.date','date')} ${sel(p+'.tag',['New Observation','Case Study','Rule Update','Question','Confirmed Pattern'])} ${inp(p+'.title','text','Title')} ${sel(p+'.status',['Open','Promoted to Playbook','Archived'])} <button data-a="del" data-p="dev" data-v="${r.id}">Delete</button><textarea data-k="${p}.body" placeholder="Details, rules, questions">${esc(r.body)}</textarea></div>`}).join('')}`;
const wk=()=>{const s=new Date(new Date(S.date)-6*864e5).toISOString().slice(0,10),I=allIdeas().filter(i=>i.d>=s&&i.d<=S.date).map(i=>({...i,n:seen(i).length})).sort((a,b)=>b.n-a.n),T={};
Object.entries(S.days).filter(([d])=>d>=s&&d<=S.date).forEach(([,v])=>v.ents.concat(v.ideas).forEach(x=>TG(x.tags).forEach(t=>T[t]=(T[t]||0)+1)));
return `<h1>Weekend Review</h1><p class="lab">7 days to ${S.date}</p><div class="card"><div class="lab">Thoughts and ideas, most repeated first</div>${I.map(i=>`<p><span class="a">${i.n?'seen '+i.n+' times before':'new'}</span> ${i.d} ${i.time} · ${esc(i.text)}</p>`).join('')||'<p>None this week</p>'}</div><div class="card"><div class="lab">Tags this week</div>${Object.entries(T).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span class="lab" style="margin-right:12px">${esc(t)} x${n}</span>`).join('')||'<p>No tags yet</p>'}</div>`};
const render=()=>{$('sb').innerHTML=`<h2>KAYZO - OS</h2><div class="lab" id="clk"></div>`+TABS.map(([k,n])=>`<button class="n${S.tab==k?' on':''}" data-a="tab" data-v="${k}">${n}</button>`).join('')+`<div style="margin-top:auto" class="lab" id="sv"></div><div class="lab" style="margin-top:8px">Backup</div><button data-a="exp">Export all (.json)</button><label><input type="file" accept=".json" hidden data-f="imp"><span class="fl" style="margin-top:4px">Import backup</span></label><button data-a="out" style="margin-top:6px">Sign out</button>`;$('m').innerHTML={dev,bt,acc,daily,wk,pb,fin,ver}[S.tab]()};
const SEED=[['v1.0','','System established. F-BOS, Asia Range, Early Liquidation profiles confirmed.',''],['v1.1','','50% pullback rule confirmed for Asia Range Continued sessions.',''],['v1.2','','Asia Range Untouched rule confirmed: 50% mitigation first, then 1H structure direction, 1H internal objective only.',''],['v1.3','2026-10-06','Forex.com/FDAX = primary chart. Broker MT5 = execution only.','Broker vs Forex.com mismatch session where the Forex.com read was correct.'],['v1.4','','F-BOS question formalised: did pre-market run liquidity or mitigate to 1H POI? Yes = reversal possible. No = continue in direction of structure.','']];
const IDLE_MIN=60;
const start=async id=>{UID=id;localStorage.kzLast=Date.now();let s=await load(),mg=0;if(!s){s=await old();mg=1}if(s)S={...S,...s,date:S.date};if(!S.ver){S.ver=SEED.map(([v,date,what,ev])=>({id:uid(),v,date,what,why:'',ev}));mg=1}if(mg)save();render();setInterval(()=>{const c=$('clk');if(c)c.textContent='Berlin '+new Date().toLocaleTimeString('en-GB',BT)},1000)};
const showLogin=(m='')=>{$('sb').innerHTML='<h2>KAYZO - OS</h2>';$('m').innerHTML=`<h1>Sign in</h1><div class="card" style="max-width:340px"><input id="em" type="email" placeholder="Email" style="width:100%;margin-bottom:8px"><input id="pw" type="password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="p" data-a="login">Sign in</button><p class="a">${esc(m)}</p></div>`};
if(!sb)$('m').innerHTML='<h1>Add your Supabase URL and key</h1><p>Edit SB_URL and SB_KEY at the top of the script in index.html.</p>';else sb.auth.getSession().then(async({data})=>{if(data.session&&Date.now()-(+localStorage.kzLast||0)<IDLE_MIN*60000)start(data.session.user.id);else{if(data.session)await sb.auth.signOut();showLogin(data.session?'Signed out after inactivity':'')}});
const touch=()=>{const n=Date.now();if(n-(+localStorage.kzLast||0)>15000)localStorage.kzLast=n};
['click','keydown','mousemove','scroll','touchstart'].forEach(v=>addEventListener(v,touch,{passive:true}));
const idleCheck=async()=>{if(UID&&Date.now()-(+localStorage.kzLast||0)>IDLE_MIN*60000){UID=null;await sb.auth.signOut();showLogin('Signed out after '+IDLE_MIN+' minutes of inactivity')}};
setInterval(idleCheck,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleCheck()});
</script></body></html>
